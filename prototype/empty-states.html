<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin – empty state prototype</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; color: #222; margin: 0; background: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 48px; }
  .grid.single { grid-template-columns: minmax(0, 560px); justify-content: center; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #777; margin: 0 0 16px; }
  input { width: 100%; box-sizing: border-box; padding: 12px 14px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
  .a { margin: 16px 0 0; font-size: 14px; color: #999; }
  .b { margin-top: 24px; padding: 40px 24px; text-align: center; border: 2px dashed #ccc; border-radius: 12px; }
  .b h3 { margin: 0 0 8px; font-size: 20px; }
  .b p { margin: 0; color: #666; }
</style>
</head>
<body>
<main class="grid" id="root"></main>
<script>
  const variant = new URLSearchParams(location.search).get("variant");
  const views = {
    a: `<p class="a">No notes yet.</p>`,
    b: `<div class="b"><h3>No notes yet</h3><p>Type above and press Enter to add your first note.</p></div>`,
  };
  const panel = (key) => `<section><h2>Variant ${key.toUpperCase()}</h2><input placeholder="Write a note…" aria-label="New note">${views[key]}</section>`;
  const root = document.getElementById("root");
  if (views[variant]) { root.classList.add("single"); root.innerHTML = panel(variant); }
  else root.innerHTML = panel("a") + panel("b");
</script>
</body>
</html>
